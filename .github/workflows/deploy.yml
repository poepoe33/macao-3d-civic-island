name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-macao-island
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 43.156.106.40 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key ubuntu@43.156.106.40 '
            set -e
            cd /var/www/macao-3d-civic-island
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e server/node_modules
            REV=$(git rev-parse --short HEAD)
            sed -i "s|social.js?v=dev|social.js?v=$REV|; s|social.css?v=dev|social.css?v=$REV|" 3d_macao_3d_civic_island.html
            cd server
            npm ci --omit=dev --no-audit --no-fund
            export DATABASE_URL="$(sudo -n grep '^DATABASE_URL=' /etc/macao-city.env | cut -d= -f2-)"
            npm run seed
            sudo -n systemctl restart macao-city
            sudo -n systemctl is-active --quiet macao-city
          '
