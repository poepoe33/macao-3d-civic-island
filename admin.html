<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理後台 · 澳門城市島</title>
<style>
  :root{
    --ink:#211d1d; --cream:#f7f1e7; --paper:#fffdf8; --soft:rgba(33,29,29,.14);
    --accent:#db6a41; --green:#4f8a63; --red:#b7462c;
    --font:"Noto Sans TC","PingFang SC","Microsoft JhengHei",system-ui,sans-serif;
    --mono:"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:linear-gradient(160deg,#f4ede2,#e9e0d2 55%,#dfd5c4);color:var(--ink);min-height:100vh}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 22px;background:rgba(247,241,231,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--soft)}
  header h1{margin:0;font-size:16px;letter-spacing:.02em}
  header .sub{font-size:11.5px;color:#7c6b5e;margin-top:2px}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 18px 60px}
  .nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .nav button{border:1px solid var(--soft);background:transparent;border-radius:999px;padding:7px 15px;font:inherit;
    font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
  .nav button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .card{background:rgba(255,253,248,.94);border:1px solid var(--soft);border-radius:16px;padding:16px 18px;margin-bottom:12px;
    box-shadow:0 6px 20px rgba(60,45,30,.06)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat{background:rgba(255,255,255,.7);border:1px solid var(--soft);border-radius:12px;padding:11px;text-align:center}
  .stat b{display:block;font-family:var(--mono);font-size:19px}
  .stat span{font-size:10.5px;color:#7c6b5e}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .muted{font-size:11.5px;color:#7c6b5e}
  input,select,textarea{width:100%;border:1px solid var(--soft);border-radius:9px;background:#fff;padding:8px 10px;
    font:inherit;font-size:12.5px;color:var(--ink)}
  textarea{min-height:80px;resize:vertical;line-height:1.55}
  label{display:block;font-size:11px;font-weight:700;color:#7c6b5e;margin:9px 0 4px}
  .btn{border:0;border-radius:9px;background:var(--ink);color:var(--cream);padding:8px 13px;font:inherit;
    font-size:12px;font-weight:800;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--soft)}
  .btn.danger{background:var(--red)}
  .btn.green{background:var(--green)}
  .btn.sm{padding:5px 9px;font-size:11px;border-radius:7px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--soft);vertical-align:middle}
  th{font-size:10.5px;color:#7c6b5e;text-transform:uppercase;letter-spacing:.05em}
  .tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:800;border:1px solid var(--soft)}
  .tag.on{background:#e6f2ea;color:#31633f;border-color:#c7e3d2}
  .tag.ban{background:#fbe6e2;color:#97351c;border-color:#f2cabe}
  .tag.draft{background:#f2eee4;color:#6f6255}
  .tag.admin{background:#e8e6fa;color:#4b4199;border-color:#d3cff3}
  .empty{text-align:center;padding:24px;color:#7c6b5e;font-size:12.5px}
  .hide{display:none !important}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--cream);
    padding:9px 16px;border-radius:99px;font-size:12.5px;opacity:0;transition:opacity .25s;z-index:99;pointer-events:none}
  .toast.show{opacity:1}
  .gate{max-width:420px;margin:12vh auto;text-align:center}
  .gate h2{font-size:18px;margin:0 0 8px}
  .gate p{font-size:12.5px;color:#7c6b5e;line-height:1.7}
  .login{display:inline-block;margin-top:14px;padding:10px 20px;border-radius:10px;background:var(--ink);color:var(--cream);
    text-decoration:none;font-size:13px;font-weight:800}
  .split{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
  @media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <h1>🛠 澳門城市島 · 管理後台</h1>
    <div class="sub" id="who">載入中…</div>
  </div>
  <div class="row">
    <a class="btn ghost" href="/" style="text-decoration:none">← 回到城市</a>
    <button class="btn ghost hide" id="logout" type="button">登出</button>
  </div>
</header>

<div class="wrap">
  <div class="gate" id="gate">
    <h2>需要管理員權限</h2>
    <p>此頁僅限管理員使用。請以管理員 Google 帳戶登入後再回到此頁。<br>預設管理員：paul.ccp@gmail.com</p>
    <a class="login" id="gate-login" href="/api/auth/google?next=/admin.html">使用 Google 登入</a>
  </div>

  <div id="app" class="hide">
    <div class="nav">
      <button data-view="overview" class="on" type="button">概覽</button>
      <button data-view="users" type="button">市民管理</button>
      <button data-view="activities" type="button">活動管理</button>
    </div>

    <section id="view-overview">
      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:12px;">
          <b style="font-size:13px;">城市數據概覽</b>
          <button class="btn ghost sm" id="stats-refresh" type="button">重新整理</button>
        </div>
        <div class="grid" id="stats"></div>
      </div>
    </section>

    <section id="view-users" class="hide">
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <b style="font-size:13px;">市民管理</b>
          <span class="muted" id="user-count"></span>
        </div>
        <div class="row" style="margin-top:10px;">
          <input id="user-q" placeholder="搜尋暱稱、姓名或 Email" style="flex:1;">
          <button class="btn" id="user-search" type="button">搜尋</button>
        </div>
      </div>
      <div class="card" style="overflow-x:auto;">
        <div id="user-list"></div>
      </div>
    </section>

    <section id="view-activities" class="hide">
      <div class="split">
        <div class="card" style="overflow-x:auto;">
          <div class="row" style="justify-content:space-between;margin-bottom:10px;">
            <b style="font-size:13px;">活動清單</b>
            <button class="btn ghost sm" id="act-refresh" type="button">重新整理</button>
          </div>
          <div id="act-list"></div>
        </div>
        <div class="card">
          <div class="row" style="justify-content:space-between;">
            <b style="font-size:13px;" id="act-form-title">建立活動</b>
            <button class="btn ghost sm" id="act-new" type="button">＋ 新增</button>
          </div>
          <input type="hidden" id="a-id">
          <label for="a-title">活動名稱</label>
          <input id="a-title" maxlength="60" placeholder="例如：路環淨灘行動">
          <div class="row" style="gap:8px;">
            <div style="flex:1;">
              <label for="a-category">類別</label>
              <select id="a-category"></select>
            </div>
            <div style="flex:1;">
              <label for="a-status">狀態</label>
              <select id="a-status">
                <option value="draft">草稿</option>
                <option value="published">已發佈</option>
                <option value="cancelled">已取消</option>
                <option value="finished">已結束</option>
              </select>
            </div>
          </div>
          <label for="a-district">分區</label>
          <select id="a-district"></select>
          <label for="a-location">地點</label>
          <input id="a-location" maxlength="80" placeholder="例如：黑沙海灘">
          <div class="row" style="gap:8px;">
            <div style="flex:1;">
              <label for="a-start">開始時間</label>
              <input type="datetime-local" id="a-start">
            </div>
            <div style="flex:1;">
              <label for="a-end">結束時間</label>
              <input type="datetime-local" id="a-end">
            </div>
          </div>
          <div class="row" style="gap:8px;">
            <div style="flex:1;">
              <label for="a-capacity">名額（留空不限）</label>
              <input type="number" id="a-capacity" min="0" max="5000" placeholder="0 = 不限">
            </div>
            <div style="flex:1;">
              <label for="a-coins">獎勵城市幣</label>
              <input type="number" id="a-coins" min="0" max="500" value="30">
            </div>
            <div style="flex:1;">
              <label for="a-xp">獎勵 XP</label>
              <input type="number" id="a-xp" min="0" max="500" value="20">
            </div>
          </div>
          <label for="a-desc">活動說明</label>
          <textarea id="a-desc" maxlength="1000" placeholder="活動內容、集合方式、注意事項…"></textarea>
          <div class="row" style="margin-top:12px;">
            <button class="btn" id="act-save" type="button">儲存活動</button>
            <button class="btn danger hide" id="act-delete" type="button">刪除</button>
            <span class="muted" id="act-hint"></span>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const state = { me: null, categories: [], districts: [], activities: [], view: 'overview' };

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      credentials: 'same-origin',
      headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
      ...opts,
    });
    let data = null;
    try { data = await res.json(); } catch (e) { /* 空回應 */ }
    if (!res.ok) {
      const err = new Error((data && data.error) || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2400);
  }

  function fmt(v) {
    if (!v) return '—';
    try {
      return new Date(v).toLocaleString('zh-MO', {
        timeZone: 'Asia/Macau', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
      });
    } catch (e) { return v; }
  }

  function toInput(v) {
    if (!v) return '';
    const d = new Date(v);
    const pad = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
      + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function switchView(view) {
    state.view = view;
    document.querySelectorAll('.nav button').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
    $('#view-overview').classList.toggle('hide', view !== 'overview');
    $('#view-users').classList.toggle('hide', view !== 'users');
    $('#view-activities').classList.toggle('hide', view !== 'activities');
    if (view === 'overview') loadStats();
    if (view === 'users') loadUsers();
    if (view === 'activities') loadActivities();
  }

  // ---------- 概覽 ----------
  async function loadStats() {
    try {
      const d = await api('/api/admin/stats');
      const s = d.stats;
      const items = [
        ['註冊市民', s.users_total], ['已建檔', s.users_onboarded], ['今日活躍', s.active_today],
        ['封禁中', s.users_banned], ['地標探索', s.discoveries], ['城市提案', s.proposals],
        ['私訊總數', s.messages], ['今日打招呼', s.greets_today], ['建設總數', s.buildings],
        ['活動總數', s.activities_total], ['進行中活動', s.activities_open],
        ['活動報名', s.activity_signups],
      ];
      $('#stats').innerHTML = items.map(([label, value]) =>
        '<div class="stat"><b>' + value + '</b><span>' + label + '</span></div>').join('');
    } catch (e) {
      toast('概覽載入失敗');
    }
  }

  // ---------- 市民管理 ----------
  async function loadUsers(q) {
    const query = q || $('#user-q').value.trim();
    try {
      const d = await api('/api/admin/users' + (query ? '?q=' + encodeURIComponent(query) : ''));
      $('#user-count').textContent = d.users.length + ' 位市民';
      if (!d.users.length) {
        $('#user-list').innerHTML = '<div class="empty">沒有符合條件的市民</div>';
        return;
      }
      $('#user-list').innerHTML =
        '<table><thead><tr><th>市民</th><th>等級</th><th>幣 / XP</th><th>聲望</th><th>分區</th><th>狀態</th><th>操作</th></tr></thead><tbody>'
        + d.users.map((u) => `
          <tr>
            <td>
              <div style="font-weight:800;">${esc(u.avatarEmoji)} ${esc(u.nickname)}</div>
              <div class="muted">${esc(u.email || '')}</div>
            </td>
            <td>Lv.${u.level}</td>
            <td>💰${u.coins}<br><span class="muted">⭐${u.xp}</span></td>
            <td>${u.reputation}</td>
            <td class="muted">${esc(u.districtIcon || '')} ${esc(u.districtName || '—')}</td>
            <td>
              ${u.banned ? '<span class="tag ban">封禁</span>' : '<span class="tag on">正常</span>'}
              ${u.role === 'admin' ? ' <span class="tag admin">管理員</span>' : ''}
            </td>
            <td>
              <div class="row" style="gap:4px;">
                <button class="btn ghost sm" data-grant="${u.id}" type="button">調整幣</button>
                <button class="btn ghost sm" data-role="${u.id}" data-next="${u.role === 'admin' ? 'citizen' : 'admin'}" type="button">
                  ${u.role === 'admin' ? '降為市民' : '設為管理員'}
                </button>
                <button class="btn ${u.banned ? 'green' : 'danger'} sm" data-ban="${u.id}" data-next="${u.banned ? '0' : '1'}" type="button">
                  ${u.banned ? '解除封禁' : '封禁'}
                </button>
              </div>
            </td>
          </tr>`).join('') + '</tbody></table>';

      document.querySelectorAll('[data-ban]').forEach((b) => {
        b.addEventListener('click', async () => {
          const banned = b.dataset.next === '1';
          let reason = '';
          if (banned) {
            reason = prompt('封禁原因（會記錄，可留空）') || '';
          }
          b.disabled = true;
          try {
            await api('/api/admin/users/' + b.dataset.ban + '/ban', {
              method: 'POST', body: JSON.stringify({ banned: banned, reason: reason }),
            });
            toast(banned ? '已封禁並登出該市民' : '已解除封禁');
            loadUsers();
          } catch (e) {
            toast('操作失敗：' + e.message);
            b.disabled = false;
          }
        });
      });

      document.querySelectorAll('[data-role]').forEach((b) => {
        b.addEventListener('click', async () => {
          const role = b.dataset.next;
          if (!confirm(role === 'admin' ? '確定將此市民設為管理員？' : '確定移除此市民的管理員權限？')) return;
          b.disabled = true;
          try {
            await api('/api/admin/users/' + b.dataset.role + '/role', {
              method: 'POST', body: JSON.stringify({ role: role }),
            });
            toast('權限已更新');
            loadUsers();
          } catch (e) {
            toast('操作失敗：' + e.message);
            b.disabled = false;
          }
        });
      });

      document.querySelectorAll('[data-grant]').forEach((b) => {
        b.addEventListener('click', async () => {
          const coins = Number(prompt('調整城市幣（可輸入負數扣除）', '50'));
          if (!Number.isFinite(coins) || coins === 0) return;
          const xpRaw = prompt('調整 XP（可留空或輸入 0）', '0');
          const xp = Number(xpRaw || 0) || 0;
          try {
            const r = await api('/api/admin/users/' + b.dataset.grant + '/grant', {
              method: 'POST', body: JSON.stringify({ coins: coins, xp: xp }),
            });
            toast('已調整：💰' + r.coins + ' · ⭐' + r.xp);
            loadUsers();
          } catch (e) {
            toast('操作失敗：' + e.message);
          }
        });
      });
    } catch (e) {
      $('#user-list').innerHTML = '<div class="empty">市民資料載入失敗</div>';
    }
  }

  // ---------- 活動管理 ----------
  function statusTag(s) {
    if (s === 'published') return '<span class="tag on">已發佈</span>';
    if (s === 'draft') return '<span class="tag draft">草稿</span>';
    if (s === 'cancelled') return '<span class="tag ban">已取消</span>';
    return '<span class="tag draft">已結束</span>';
  }

  async function loadActivities() {
    try {
      const d = await api('/api/admin/activities');
      state.activities = d.activities;
      state.categories = d.categories;
      fillCategoryOptions();
      renderActivityList();
    } catch (e) {
      $('#act-list').innerHTML = '<div class="empty">活動資料載入失敗</div>';
    }
  }

  function fillCategoryOptions() {
    const sel = $('#a-category');
    if (!sel.options.length && state.categories.length) {
      sel.innerHTML = state.categories.map((c) =>
        '<option value="' + esc(c.key) + '">' + esc(c.icon) + ' ' + esc(c.name) + '</option>').join('');
    }
    const ds = $('#a-district');
    if (!ds.options.length && state.districts.length) {
      ds.innerHTML = '<option value="">（不分區 / 全澳）</option>'
        + state.districts.map((x) =>
          '<option value="' + esc(x.id) + '">' + esc(x.icon) + ' ' + esc(x.code) + ' · ' + esc(x.name) + '</option>').join('');
    }
  }

  function renderActivityList() {
    if (!state.activities.length) {
      $('#act-list').innerHTML = '<div class="empty">還沒有活動，右側建立第一個活動吧。</div>';
      return;
    }
    $('#act-list').innerHTML =
      '<table><thead><tr><th>活動</th><th>時間</th><th>報名</th><th>狀態</th><th>操作</th></tr></thead><tbody>'
      + state.activities.map((a) => `
        <tr>
          <td>
            <div style="font-weight:800;">${esc(a.categoryIcon)} ${esc(a.title)}</div>
            <div class="muted">${esc(a.location || a.districtName || '全澳')}</div>
          </td>
          <td class="muted">${fmt(a.startAt)}</td>
          <td>${a.goingCount}${a.capacity ? ' / ' + a.capacity : ''}<br><span class="muted">簽到 ${a.checkedCount}</span></td>
          <td>${statusTag(a.status)}</td>
          <td>
            <div class="row" style="gap:4px;">
              <button class="btn ghost sm" data-edit="${a.id}" type="button">編輯</button>
              <button class="btn ghost sm" data-signups="${a.id}" type="button">名單</button>
            </div>
          </td>
        </tr>`).join('') + '</tbody></table>';

    document.querySelectorAll('[data-edit]').forEach((b) => {
      b.addEventListener('click', () => fillActivityForm(Number(b.dataset.edit)));
    });
    document.querySelectorAll('[data-signups]').forEach((b) => {
      b.addEventListener('click', () => showSignups(Number(b.dataset.signups)));
    });
  }

  function fillActivityForm(id) {
    const a = state.activities.find((x) => x.id === id);
    if (!a) return;
    $('#act-form-title').textContent = '編輯活動 #' + id;
    $('#a-id').value = id;
    $('#a-title').value = a.title;
    $('#a-category').value = a.category;
    $('#a-status').value = a.status;
    $('#a-district').value = a.districtId || '';
    $('#a-location').value = a.location || '';
    $('#a-start').value = toInput(a.startAt);
    $('#a-end').value = toInput(a.endAt);
    $('#a-capacity').value = a.capacity || '';
    $('#a-coins').value = a.rewardCoins;
    $('#a-xp').value = a.rewardXp;
    $('#a-desc').value = a.description;
    $('#act-delete').classList.remove('hide');
    $('#act-hint').textContent = '目前報名 ' + a.goingCount + ' 人 · 簽到 ' + a.checkedCount + ' 人';
    $('#a-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function resetActivityForm() {
    $('#act-form-title').textContent = '建立活動';
    $('#a-id').value = '';
    ['a-title', 'a-location', 'a-start', 'a-end', 'a-capacity', 'a-desc'].forEach((k) => { $('#' + k).value = ''; });
    $('#a-status').value = 'draft';
    $('#a-coins').value = 30;
    $('#a-xp').value = 20;
    $('#a-category').selectedIndex = 0;
    $('#a-district').value = '';
    $('#act-delete').classList.add('hide');
    $('#act-hint').textContent = '';
  }

  async function saveActivity() {
    const id = $('#a-id').value;
    const payload = {
      title: $('#a-title').value.trim(),
      category: $('#a-category').value,
      status: $('#a-status').value,
      districtId: $('#a-district').value || null,
      location: $('#a-location').value.trim(),
      startAt: $('#a-start').value ? new Date($('#a-start').value).toISOString() : '',
      endAt: $('#a-end').value ? new Date($('#a-end').value).toISOString() : '',
      capacity: $('#a-capacity').value ? Number($('#a-capacity').value) : 0,
      rewardCoins: Number($('#a-coins').value) || 0,
      rewardXp: Number($('#a-xp').value) || 0,
      description: $('#a-desc').value.trim(),
    };
    if (!payload.title || !payload.description || !payload.startAt || !payload.endAt) {
      toast('請填寫名稱、說明與起訖時間');
      return;
    }
    const btn = $('#act-save');
    btn.disabled = true;
    try {
      if (id) {
        await api('/api/admin/activities/' + id, { method: 'POST', body: JSON.stringify(payload) });
        toast('活動已更新');
      } else {
        await api('/api/admin/activities', { method: 'POST', body: JSON.stringify(payload) });
        toast('活動已建立');
      }
      resetActivityForm();
      await loadActivities();
    } catch (e) {
      toast('儲存失敗：' + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function showSignups(id) {
    try {
      const d = await api('/api/activities/' + id);
      const a = d.activity;
      const rows = (d.signups || []).map((s) => `
        <tr>
          <td>${esc(s.avatarEmoji)} ${esc(s.nickname)} <span class="muted">Lv.${s.level}</span></td>
          <td>${s.status === 'going' ? '已報名' : '已取消'}</td>
          <td>${s.checkedInAt ? fmt(s.checkedInAt) : '未簽到'}</td>
        </tr>`).join('');
      const html = '<div style="font-weight:800;margin-bottom:6px;">' + esc(a.title) + ' · 名單</div>'
        + (rows
          ? '<table><thead><tr><th>市民</th><th>狀態</th><th>簽到時間</th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div class="empty">尚無人報名</div>');
      const w = window.open('', '_blank', 'width=560,height=640');
      if (!w) { toast('請允許彈出視窗以查看名單'); return; }
      w.document.write('<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>活動名單</title>'
        + '<style>body{font-family:system-ui,sans-serif;padding:20px;color:#211d1d;background:#faf6ee}'
        + 'table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:7px 5px;border-bottom:1px solid #e0d8cb}'
        + '.muted{color:#7c6b5e;font-size:11.5px}</style></head><body>' + html + '</body></html>');
      w.document.close();
    } catch (e) {
      toast('名單載入失敗');
    }
  }

  // ---------- 啟動 ----------
  async function boot() {
    try {
      const me = await api('/api/me');
      state.me = me;
      if (!me.authenticated) { showGate(); return; }
      if (!me.user.isAdmin) {
        $('#gate').innerHTML = '<h2>沒有管理員權限</h2><p>目前登入帳號：' + esc(me.user.email || me.user.nickname)
          + '<br>如需權限請聯絡系統管理員。</p><a class="login" href="/">回到城市</a>';
        return;
      }
      $('#gate').classList.add('hide');
      $('#app').classList.remove('hide');
      $('#logout').classList.remove('hide');
      $('#who').textContent = (me.user.nickname || '管理員') + ' · ' + (me.user.email || '') + ' · 已登入';
      try {
        const d = await api('/api/districts');
        state.districts = d.districts || [];
      } catch (e) { /* 非必要 */ }
      loadStats();
    } catch (e) {
      showGate();
    }
  }

  function showGate() {
    $('#gate').classList.remove('hide');
    $('#app').classList.add('hide');
    $('#logout').classList.add('hide');
    $('#gate-login').href = '/api/auth/google?next=' + encodeURIComponent('/admin.html');
  }

  $('#gate-login').href = '/api/auth/google?next=' + encodeURIComponent('/admin.html');
  $('#logout').addEventListener('click', async () => {
    try { await api('/api/auth/logout', { method: 'POST', body: '{}' }); } catch (e) { /* 忽略 */ }
    location.reload();
  });
  document.querySelectorAll('.nav button').forEach((b) => {
    b.addEventListener('click', () => switchView(b.dataset.view));
  });
  $('#stats-refresh').addEventListener('click', loadStats);
  $('#user-search').addEventListener('click', () => loadUsers());
  $('#user-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadUsers(); });
  $('#act-refresh').addEventListener('click', loadActivities);
  $('#act-new').addEventListener('click', resetActivityForm);
  $('#act-save').addEventListener('click', saveActivity);
  $('#act-delete').addEventListener('click', async () => {
    const id = $('#a-id').value;
    if (!id || !confirm('確定刪除這個活動？報名紀錄會一併刪除。')) return;
    try {
      await api('/api/admin/activities/' + id, { method: 'DELETE' });
      toast('活動已刪除');
      resetActivityForm();
      loadActivities();
    } catch (e) {
      toast('刪除失敗');
    }
  });

  boot();
})();
</script>
</body>
</html>
